[package]
name = "zk-lsp"
version = "0.5.5"
edition = "2021"
license = "AGPL-3.0"
description = "LSP server and CLI for a Typst-based Zettelkasten wiki"
repository = "https://github.com/pxwg/zk-lsp.typ"
homepage = "https://github.com/pxwg/zk-lsp.typ"

[lib]
name = "zk_lsp"
path = "src/lib.rs"

[[bin]]
name = "zk-lsp"
path = "src/main.rs"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-debouncer-mini = "0.4"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
once_cell = "1"
url = "2"
chrono = "0.4"
dashmap = "5"
futures = "0.3"
anyhow = "1"
toml = "0.8"
unicode-width = "0.2"
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = "3"

[[bench]]
name = "notes_json"
harness = false

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
